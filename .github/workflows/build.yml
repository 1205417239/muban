name: Build Kayoko

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"

      - name: Install SDK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/theos/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          find /tmp/sdks -maxdepth 2 -type d -name "*.sdk" -exec cp -R {} "$GITHUB_WORKSPACE/theos/sdks/" \;

      - name: Show SDKs
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          echo "THEOS=$THEOS"
          ls -la "$THEOS/sdks"

      - name: Build
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          export PATH="$THEOS/bin:$PATH"
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Find package
        run: |
          find . -type f -name "*.deb" -print

          if ! find . -type f -name "*.deb" | grep -q .; then
            echo "ERROR: No .deb package generated."
            exit 1
          fi

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Kayoko-deb
          path: "**/*.deb"
          if-no-files-found: error
          retention-days: 7
